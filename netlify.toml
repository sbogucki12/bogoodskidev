[build]
  publish = "."

# Security headers (site-wide)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "accelerometer=(), browsing-topics=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    # No inline scripts or styles, no third-party origins. The JSON-LD block is a
    # non-executable data block, so it is not subject to script-src.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

# Fonts never change under the same name: cache hard.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images/icons are not content-hashed, so keep caching long but revalidatable.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Serve the LLM-facing docs as UTF-8 markdown/plain text.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Repo docs live in the publish dir (".") but are for maintainers, not visitors.
# Force a 404 so they are never served from the website. (They remain visible
# in the public GitHub repo, so keep them free of anything sensitive.)
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true

# Redirect www to root domain
[[redirects]]
  from = "https://www.bogoodski.dev/*"
  to = "https://bogoodski.dev/:splat"
  status = 301
  force = true

# Old asset URLs (cached by social platforms) -> new optimized assets
[[redirects]]
  from = "/assets/social.png"
  to = "/assets/img/social-card.jpg"
  status = 301

[[redirects]]
  from = "/assets/profile.png"
  to = "/assets/img/steve-bogucki-720.jpg"
  status = 301

[[redirects]]
  from = "/assets/favicon.png"
  to = "/assets/icons/icon-192.png"
  status = 301
